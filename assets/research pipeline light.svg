<svg viewBox="0 0 900 330" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a4a"/>
    </marker>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b4d1b"/><stop offset="100%" stop-color="#276b27"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#235c23"/><stop offset="100%" stop-color="#2f7a2f"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2C7A2C"/><stop offset="100%" stop-color="#389838"/>
    </linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d8f3d"/><stop offset="100%" stop-color="#49ad49"/>
    </linearGradient>
    <linearGradient id="g5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ea54e"/><stop offset="100%" stop-color="#5ac35a"/>
    </linearGradient>
    <linearGradient id="g6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5fbb5f"/><stop offset="100%" stop-color="#6bd96b"/>
    </linearGradient>
  </defs>

  <!-- Row 1 -->
  <g>
    <rect x="20" y="30" width="260" height="90" rx="14" fill="url(#g1)"/>
    <text x="150" y="66" text-anchor="middle" font-size="24">🌲</text>
    <text x="150" y="95" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Field Inventory</text>
  </g>
  <g>
    <rect x="310" y="30" width="260" height="90" rx="14" fill="url(#g2)"/>
    <text x="440" y="66" text-anchor="middle" font-size="24">🛰️</text>
    <text x="440" y="95" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Remote Sensing &amp; UAV Data</text>
  </g>
  <g>
    <rect x="600" y="30" width="260" height="90" rx="14" fill="url(#g3)"/>
    <text x="730" y="66" text-anchor="middle" font-size="24">🗺️</text>
    <text x="730" y="95" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">GIS &amp; Spatial Analysis</text>
  </g>

  <!-- Row 2 -->
  <g>
    <rect x="600" y="210" width="260" height="90" rx="14" fill="url(#g4)"/>
    <text x="730" y="246" text-anchor="middle" font-size="24">🤖</text>
    <text x="730" y="275" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Statistical / ML Models</text>
  </g>
  <g>
    <rect x="310" y="210" width="260" height="90" rx="14" fill="url(#g5)"/>
    <text x="440" y="246" text-anchor="middle" font-size="24">💻</text>
    <text x="440" y="275" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Geospatial Applications</text>
  </g>
  <g>
    <rect x="20" y="210" width="260" height="90" rx="14" fill="url(#g6)"/>
    <text x="150" y="246" text-anchor="middle" font-size="24">🌍</text>
    <text x="150" y="275" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Monitoring &amp; Decision Support</text>
  </g>

  <!-- Arrows: row 1 left to right -->
  <line x1="284" y1="75" x2="306" y2="75" stroke="#4a4a4a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="574" y1="75" x2="596" y2="75" stroke="#4a4a4a" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Arrow: down from row1 col3 to row2 col3 -->
  <path d="M 730 122 L 730 206" stroke="#4a4a4a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Arrows: row 2 right to left -->
  <line x1="596" y1="255" x2="574" y2="255" stroke="#4a4a4a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="306" y1="255" x2="284" y2="255" stroke="#4a4a4a" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>
